# Security scanning workflow for go-tor
# Runs on push to main, pull requests, and weekly schedule
# Includes: gosec (SAST), govulncheck (dependency scanning), Trivy (container),
#           and CodeQL (semantic code analysis)
# All third-party Actions are pinned to immutable SHA hashes for supply chain security.
name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Mondays at 6 AM UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  gosec:
    name: gosec SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.27.x'

      # 不用 securego/gosec Docker Action：v2.29.0 的 action.yml 仍拉取 2.28.0 镜像，
      # 其内置 Go 无法解析 go.mod 的 1.27.1，扫描会空退（SARIF 0 规则）并以非 0 退出。
      # 用本 job 已安装的 Go 1.27 编译 gosec v2.29.0（支持 Go 1.27）。
      # 存量告警已清零，扫描失败即阻断合并。
      - name: Run gosec
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          gosec -fmt sarif -out results.sarif ./...

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        with:
          sarif_file: results.sarif
        if: success() || failure()

  govulncheck:
    name: govulncheck Dependency Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.27.x'

      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f  # v1.1.0

  trivy:
    name: Trivy Container Scanning
    runs-on: ubuntu-latest
    # Skip container scanning for draft PRs; run for all other events
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build container image
        run: docker build -t go-tor:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: 'go-tor:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        with:
          sarif_file: 'trivy-results.sarif'
        if: success() || failure()

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        with:
          languages: go

      - name: Autobuild
        uses: github/codeql-action/autobuild@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        with:
          category: "/language:go"
